http:
  address: ${COLLECTOR_HTTP_ADDR:0.0.0.0:4195}

input:
  broker:
    inputs:
      - google_workspace:
          credentials_file: ${GWS_CREDENTIALS_FILE:}
          subject: ${GWS_ADMIN_SUBJECT:admin@example.ac.in}
          org: ${COLLECTOR_ORG:example-university}
          server: ${COLLECTOR_SERVER:google-workspace}
          applications: [ login, admin, token, drive, user_accounts, gmail, saml, groups, takeout, rules, context_aware_access, admin_data_action, calendar, meet ]
          poll_interval: 1m
          initial_lookback: ${GWS_INITIAL_LOOKBACK:24h}
          checkpoint:
            type: file
            path: ${COLLECTOR_STATE_DIR:./state}/checkpoints.json

      - google_workspace_alerts:
          credentials_file: ${GWS_CREDENTIALS_FILE:}
          subject: ${GWS_ADMIN_SUBJECT:admin@example.ac.in}
          org: ${COLLECTOR_ORG:example-university}
          server: ${COLLECTOR_SERVER:google-workspace}
          poll_interval: 1m
          initial_lookback: ${GWS_INITIAL_LOOKBACK:24h}
          checkpoint:
            type: file
            path: ${COLLECTOR_STATE_DIR:./state}/alerts-checkpoints.json

output:
  switch:
    cases:
      - check: env("COLLECTOR_OUTPUT") == "kafka"
        output:
          kafka_franz:
            seed_brokers: [ "${KAFKA_BROKERS:localhost:9094}" ]
            topic: ${KAFKA_TOPIC:google_workspace}
            key: ${! meta("event_id") }
            max_in_flight: 1
      - output:
          stdout:
            codec: lines

metrics:
  prometheus: {}

logger:
  level: ${LOG_LEVEL:INFO}
  format: logfmt
