name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go mod tidy
        run: go mod tidy -diff

      - name: vet
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: test
        run: go test -race -count=1 ./...

      - name: build linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/collector

      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
